<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1914" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%231b1914'/><path d='M0 10l4-2 4 2 4-2 4 2v6H0z' fill='%234d3e2a'/><circle cx='8' cy='5' r='2' fill='%23d9b35f'/></svg>" />
    <title>Grabenfront</title>
  </head>
  <body>
    <div id="app">
      <div id="views">
        <!-- Kampagnenkarte -->
        <div id="mapview" class="view">
          <canvas id="mapcanvas"></canvas>
          <svg id="mapsvg"></svg>
          <div id="mapmarkers"></div>
        </div>
        <!-- Schlacht -->
        <div id="stage" class="view" hidden>
          <canvas id="bg"></canvas>
          <canvas id="gl"></canvas>
          <svg id="overlay"></svg>
          <div id="flags"></div>
          <div id="scalebar" data-label="50 m"></div>
        </div>
      </div>

      <header id="topbar">
        <div class="group">
          <button id="back" class="icon" title="Zur Karte (Esc)" hidden>🗺</button>
          <button id="pause" class="icon" title="Pause (Leertaste)">⏸</button>
          <button class="speed" data-speed="1">1×</button>
          <button class="speed" data-speed="2">2×</button>
          <button class="speed" data-speed="4">4×</button>
          <button class="speed" data-speed="8">8×</button>
          <button id="soundBtn" class="icon" title="Ton an/aus">🔊</button>
          <button id="helpBtn" class="icon" title="Taktik-Hilfe">?</button>
        </div>
        <div id="clock"></div>
        <div class="group" id="topinfo"></div>
      </header>

      <div id="modebar" hidden>
        <span id="modetext"></span>
        <button id="modecancel">Abbrechen</button>
      </div>
      <div id="toasts"></div>

      <!-- Menü unten: Kampagne -->
      <footer id="mapPanel" class="panel" hidden>
        <nav id="tabs">
          <button data-tab="info">Lage</button>
          <button data-tab="army">Armee</button>
          <button data-tab="recruit">Ausbilden</button>
          <button data-tab="diplo">Diplomatie</button>
          <button data-tab="log">Meldungen</button>
        </nav>
        <div id="tabbody"></div>
      </footer>

      <!-- Menü unten: Schlacht -->
      <footer id="panel" class="panel" hidden>
        <div id="selinfo"></div>
        <div class="row" id="orders">
          <button data-order="cover" title="Luftschutz (L): über der eigenen Stellung bleiben, feindliche Magier und Stürmer abfangen">Luftschutz</button>
          <button data-order="escort" title="Begleiten (B): eigene Stürme und Einbrüche aus der Luft schützen">Begleiten</button>
          <button data-order="hunt" title="Jagd (J): MG-Nester und Truppen im Freien jagen, auch ohne Luftüberlegenheit">Jagd</button>
          <button data-order="blast" class="danger" title="Sprengzauber (Z): Stelle antippen – große Explosion, trifft auch im Graben">Sprengzauber</button>
          <button data-order="dome" title="Schutzkuppel (X): über eigene Truppen legen – Kugeln und Splitter prallen ab">Kuppel</button>
          <button data-order="retreat" title="Zurück (R): heim zum Aufladen">Zurück</button>
        </div>
        <div class="row" id="flankRow"></div>
        <div class="row" id="support">
          <button id="generalBtn" class="danger" title="Generalangriff (G): alle Flanken stürmen gleichzeitig">General&shy;angriff</button>
          <button id="retreatAllBtn" title="Voller Rückzug (Q): Angriffe abbrechen, alle zurück in die eigene Stellung">Rückzug</button>
          <button id="planBtn" title="Angriff planen (P): Stelle antippen, der Offizier bereitet vor und stürmt">Angriff planen</button>
          <button id="arty" title="A">Artillerie</button>
          <button id="smokeBtn" title="Nebel schießen (N)">Nebel</button>
          <button id="gasBtn" title="Gas schießen (K): treibt mit dem Wind, auch auf die eigenen Leute">Gas</button>
          <button id="reserve">Reserve</button>
          <button id="styleBtn" title="Darstellung wechseln (V)">Darstellung</button>
          <button id="fit" class="icon" title="Ganze Karte">⤢</button>
        </div>
        <div id="chips"></div>
      </footer>

      <div id="dialog" class="dialog" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
