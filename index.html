<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1914" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%231b1914'/><path d='M0 10l4-2 4 2 4-2 4 2v6H0z' fill='%234d3e2a'/><circle cx='8' cy='5' r='2' fill='%23d9b35f'/></svg>" />
    <title>Grabenfront</title>
  </head>
  <body>
    <div id="app">
      <div id="views">
        <!-- Kampagnenkarte -->
        <div id="mapview" class="view">
          <canvas id="mapcanvas"></canvas>
          <svg id="mapsvg"></svg>
          <div id="mapmarkers"></div>
        </div>
        <!-- Schlacht -->
        <div id="stage" class="view" hidden>
          <canvas id="bg"></canvas>
          <canvas id="gl"></canvas>
          <svg id="overlay"></svg>
          <div id="flags"></div>
          <div id="scalebar" data-label="50 m"></div>
        </div>
      </div>

      <header id="topbar">
        <div class="group">
          <button id="back" class="icon" title="Zur Karte (Esc)" hidden>🗺</button>
          <button id="pause" class="icon" title="Pause (Leertaste)">⏸</button>
          <button class="speed" data-speed="1">1×</button>
          <button class="speed" data-speed="2">2×</button>
          <button class="speed" data-speed="4">4×</button>
          <button class="speed" data-speed="8">8×</button>
          <button id="soundBtn" class="icon" title="Ton an/aus">🔊</button>
        </div>
        <div id="clock"></div>
        <div class="group" id="topinfo"></div>
      </header>

      <div id="modebar" hidden>
        <span id="modetext"></span>
        <button id="modecancel">Abbrechen</button>
      </div>
      <div id="toasts"></div>

      <!-- Menü unten: Kampagne -->
      <footer id="mapPanel" class="panel" hidden>
        <nav id="tabs">
          <button data-tab="info">Lage</button>
          <button data-tab="army">Armee</button>
          <button data-tab="recruit">Ausbilden</button>
          <button data-tab="diplo">Diplomatie</button>
          <button data-tab="log">Meldungen</button>
        </nav>
        <div id="tabbody"></div>
      </footer>

      <!-- Menü unten: Schlacht -->
      <footer id="panel" class="panel" hidden>
        <div id="selinfo"></div>
        <div class="row" id="orders">
          <button data-order="hold" title="H">Halten</button>
          <button data-order="storm" class="danger" title="S">Sturm!</button>
          <button data-order="retreat" title="R">Rückzug</button>
          <button data-order="officer" id="officerBtn" title="O">Offizier</button>
        </div>
        <div class="row" id="flankRow"></div>
        <div class="row" id="support">
          <button id="arty" title="A">Artillerie</button>
          <button id="reserve">Reserve</button>
          <button id="styleBtn" title="Darstellung wechseln (V)">Darstellung</button>
          <button id="fit" class="icon" title="Ganze Karte">⤢</button>
        </div>
        <div id="chips"></div>
      </footer>

      <div id="dialog" class="dialog" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
